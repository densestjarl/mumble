name: Security

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  CMAKE_OPTIONS: |
      -Dtests=OFF -Dsymbols=ON -Dwarnings-as-errors=OFF -Dlto=OFF

jobs:
  # Preserve the historical analysis key and matrix used for PR comparisons.
  CodeQL-Build:
    name: CodeQL legacy comparison (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    outputs:
      # This scalar output and the shared artifact name require a single matrix leg.
      # Additional legs need per-leg artifacts and compatibility uploads.
      sarif-artifact-id: ${{ steps.sarif-artifact.outputs.artifact-id }}

    permissions: &codeql_permissions
      security-events: write
      actions: read
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
          submodules: 'recursive'

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
          languages: python, cpp

    - uses: ./.github/actions/install-dependencies
      with:
          type: shared
          os: ubuntu-latest
          arch: x86_64

    - name: Create build dir
      run: cmake -E make_directory "${GITHUB_WORKSPACE}/build-codeql"

    - name: Run CMake
      run: |
          cmake -G Ninja -S "${GITHUB_WORKSPACE}" -B "${GITHUB_WORKSPACE}/build-codeql" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=cmake/mumble_dependency_provider.cmake \
          $CMAKE_OPTIONS \
          -DBoost_NO_BOOST_CMAKE=ON -DCMAKE_UNITY_BUILD=ON
      shell: bash

    - name: Build
      working-directory: ${{ github.workspace }}/build-codeql
      run: cmake --build . --config $BUILD_TYPE
      shell: bash

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
          # Share the merged, fingerprinted C++/Python results, so the upload
          # job needs neither another build nor the CodeQL CLI to merge files.
          post-processed-sarif-path: ${{ runner.temp }}/codeql-sarif

    - name: Share CodeQL results
      id: sarif-artifact
      uses: actions/upload-artifact@v7
      with:
          # Fresh names support full reruns; the output ID also lets a rerun of
          # only the compatibility job reuse the earlier artifact until expiry.
          name: codeql-sarif-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-sarif/upload.sarif
          if-no-files-found: error
          retention-days: 1

  # Both configurations exist on master. Re-upload the same results under the
  # newer job ID, keeping its check and scan comparison without repeating the
  # build or analysis. A success-only job would leave this configuration stale.
  codeql:
    name: CodeQL
    needs: CodeQL-Build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: *codeql_permissions

    steps:
    - name: Require successful CodeQL analysis
      env:
          ANALYSIS_RESULT: ${{ needs.CodeQL-Build.result }}
      run: test "$ANALYSIS_RESULT" = success

    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v8
      with:
          artifact-ids: ${{ needs.CodeQL-Build.outputs.sarif-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/codeql-sarif

    # upload-sarif does not override an existing SARIF automationDetails ID.
    # Change only that ID to match the newer job's historical category.
    - name: Set compatibility scan category
      shell: python
      run: |
          import json
          import os
          from pathlib import Path

          sarifPath = Path(os.environ["RUNNER_TEMP"]) / "codeql-sarif" / "upload.sarif"
          sarif = json.loads(sarifPath.read_text(encoding="utf-8"))
          for run in sarif["runs"]:
              run.setdefault("automationDetails", {})["id"] = ".github/workflows/code-ql.yml:codeql/"
          sarifPath.write_text(json.dumps(sarif), encoding="utf-8")

    - name: Publish compatibility CodeQL results
      uses: github/codeql-action/upload-sarif@v4
      with:
          sarif_file: ${{ runner.temp }}/codeql-sarif/upload.sarif
          wait-for-processing: true
